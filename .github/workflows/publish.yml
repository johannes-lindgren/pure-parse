name: Publish

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: $/.github/workflows/code-integration-checks.yml

  publish-npm:
    name: Publish NPM
    needs: ci
    if: always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm exec turbo run build --filter=pure-parse
      - name: Copy README into the workspace
        run: |
          cp README.md packages/pure-parse/
          cp LICENSE packages/pure-parse/
      - name: Publish to NPM
        run: pnpm publish --access public --provenance --no-git-checks --filter pure-parse

  # Docs follow npm releases
  deploy-docs:
    needs: publish-npm
    permissions:
      contents: read
    uses: $/.github/workflows/deploy-docs.yml
