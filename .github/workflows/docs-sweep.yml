name: Docs preview sweep

# Deletes previews of PRs closed in the last 14 days, in case cleanup missed them.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep docs previews
    runs-on: ubuntu-latest
    environment: Vercel
    steps:
      - name: Previews of recently closed pull requests
        id: closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '14 days ago' +%F)
          names=$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed \
            --search "closed:>=$since" --limit 1000 \
            --json number --jq 'map("pr-\(.number)") | join(" ")')
          echo "Sweeping: ${names:-nothing}"
          echo "names=$names" >>"$GITHUB_OUTPUT"
      - if: steps.closed.outputs.names != ''
        uses: $/.github/actions/vercel-preview/sweep
        with:
          api-token: ${{ secrets.VERCEL_TOKEN }}
          account-id: ${{ vars.VERCEL_ORG_ID }}
          project-id: ${{ vars.VERCEL_PROJECT_ID }}
          names: ${{ steps.closed.outputs.names }}
