name: Deploy docs

# Called by publish.yml after each npm release. Run by hand for docs-only fixes.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    environment:
      name: Vercel
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: docs-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run docs:build --filter=pure-parse
      - id: deploy
        uses: ./.github/actions/vercel-preview/deploy
        with:
          api-token: ${{ secrets.VERCEL_TOKEN }}
          account-id: ${{ vars.VERCEL_ORG_ID }}
          project-id: ${{ vars.VERCEL_PROJECT_ID }}
          directory: packages/pure-parse/.vitepress/dist
          root-directory: packages/pure-parse
