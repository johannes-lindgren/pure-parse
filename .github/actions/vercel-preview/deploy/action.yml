name: Vercel deploy
description: Upload a built site to Vercel production and output its URL.

inputs:
  api-token:
    description: Vercel access token.
    required: true
  account-id:
    description: Vercel team ID.
    required: true
  project-id:
    description: Vercel project ID.
    required: true
  directory:
    description: The built site.
    required: true
  root-directory:
    description: The project's Root Directory setting in Vercel, if set.
    required: false
    default: ''
  vercel-version:
    description: Vercel CLI version.
    required: false
    default: 65.14.0

outputs:
  url:
    description: Deployment URL.
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.api-token }}
        VERCEL_ORG_ID: ${{ inputs.account-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        DIRECTORY: ${{ inputs.directory }}
        ROOT_DIRECTORY: ${{ inputs.root-directory }}
        VERCEL: npx --yes vercel@${{ inputs.vercel-version }}
      run: |
        set -o pipefail
        # Minimal Build Output API: static files only
        out=$(mktemp -d "$RUNNER_TEMP/vercel-XXXXXX")
        # The CLI looks for the output under the project's Root Directory
        build="$out/${ROOT_DIRECTORY:-.}/.vercel/output"
        mkdir -p "$build"
        cp -R "$DIRECTORY/." "$build/static"
        echo '{"version":3}' >"$build/config.json"
        cd "$out"
        url=$($VERCEL deploy --prebuilt --prod --yes | tail -n 1)
        echo "url=$url" >>"$GITHUB_OUTPUT"
