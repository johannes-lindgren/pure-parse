name: Cloudflare preview
description: Publish a named Worker preview and output its URL.

inputs:
  api-token:
    description: Cloudflare API token.
    required: true
  account-id:
    description: Cloudflare account ID.
    required: true
  name:
    description: Preview name, e.g. pr-123.
    required: true
  working-directory:
    description: Directory with wrangler.jsonc.
    required: false
    default: .

outputs:
  url:
    description: Preview URL.
    value: ${{ steps.preview.outputs.url }}

runs:
  using: composite
  steps:
    - id: preview
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
        PREVIEW: ${{ inputs.name }}
      run: |
        set -o pipefail
        output=$(npx --no-install wrangler preview --name "$PREVIEW" --json)
        printf '%s\n' "$output"
        url=$(printf '%s\n' "$output" | sed -n '/^{/,$p' | jq -er '.preview.urls[0]')
        echo "url=$url" >>"$GITHUB_OUTPUT"
